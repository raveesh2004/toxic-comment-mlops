name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies (CPU wheels)
        run: |
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run tests
        run: pytest -v

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      # The image expects a trained model/ dir; provide a placeholder so the
      # build itself is validated in CI without shipping weights.
      - name: Create placeholder model dir
        run: mkdir -p model && touch model/.gitkeep

      - name: Build Docker image
        run: docker build -t toxic-comment-classifier .
